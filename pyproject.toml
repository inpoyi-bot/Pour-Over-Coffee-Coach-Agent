# Vercel 的运行依赖；本地 demo/eval 仍按 requirements.txt 安装。
# 基础 ADK + SQLAlchemy 已覆盖数据库能力，无需带上 eval 或 Spanner 扩展。
[project]
name = "coffee-coach-web"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-adk==2.3.0",
    "google-genai==2.10.0",
    "fastapi==0.138.1",
    "uvicorn==0.49.0",
    "sqlalchemy[asyncio]==2.0.51",
    "pydantic==2.12.5",
    "python-dotenv==1.0.1",
    "psycopg[binary]==3.3.6",
]

[tool.vercel]
entrypoint = "app:app"

# 运行源码即可，不将这个仓库构建成供他人安装的 Python 包。
[tool.uv]
package = false
